#
# SPDX-License-Identifier: Apache-2.0
#
# F1 handover (rfsim) scenario: OAI 5G core + 1 CU + 2 DUs + 1 UE.
#
#   AMF ─NG─ oai-cu(.150) ─F1─┬─ oai-du-pci0(.171)  PCI0  rfsim client ─┐
#            RRC+PDCP         │                                          ├─▶ oai-nr-ue(.181)
#            telnet :9090     └─ oai-du-pci1(.172)  PCI1  rfsim client ─┘   rfsim SERVER
#            trigger_f1_ho
#
# The core services (mysql/amf/smf/upf/ext-dn) are identical to the project's
# single-gNB stack — F1 handover is intra-CU so there is one NG connection.
# Start order matters (CU -> DU0 -> UE -> DU1); use start_handover.sh, not a bare
# `docker compose up`.
#
services:
    mysql:
        container_name: "oai-mysql"
        image: mysql:8.0
        volumes:
            - ../common/oai_db.sql:/docker-entrypoint-initdb.d/oai_db.sql
            - ../common/mysql-healthcheck.sh:/tmp/mysql-healthcheck.sh
        environment:
            - TZ=Europe/Paris
            - MYSQL_DATABASE=oai_db
            - MYSQL_USER=test
            - MYSQL_PASSWORD=test
            - MYSQL_ROOT_PASSWORD=linux
        healthcheck:
            test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
            interval: 10s
            timeout: 5s
            retries: 30
        networks:
            public_net:
                ipv4_address: 192.168.71.131
    oai-amf:
        container_name: "oai-amf"
        image: oaisoftwarealliance/oai-amf:${AMF_TAG:-v2.1.10}
        environment:
            - TZ=Europe/Paris
            - OPERATOR_KEY=63bfa50ee6523365ff14c1f45f88737d
        volumes:
            - ${SYSTEM_CONFIG:-../common/sys_config.yaml}:/openair-amf/etc/config.yaml
        depends_on:
            - mysql
        networks:
            public_net:
                ipv4_address: 192.168.71.132
    oai-smf:
        container_name: "oai-smf"
        image: oaisoftwarealliance/oai-smf:${SMF_TAG:-v2.1.10}
        environment:
            - TZ=Europe/Paris
        volumes:
            - ${SYSTEM_CONFIG:-../common/sys_config.yaml}:/openair-smf/etc/config.yaml
        depends_on:
            - oai-amf
        networks:
            public_net:
                ipv4_address: 192.168.71.133
    oai-upf:
        container_name: "oai-upf"
        image: oaisoftwarealliance/oai-upf:${UPF_TAG:-v2.1.10}
        environment:
            - TZ=Europe/Paris
        entrypoint: /bin/bash -c \
                    "echo '200 eth1_table' >> /etc/iproute2/rt_tables;"\
                    "ip route del default || true;"\
                    "ip route add default via 192.168.72.135 dev eth1 table eth1_table;"\
                    "ip rule add from 12.1.1.0/24 table eth1_table;"\
                    "/openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"
        volumes:
            - ${SYSTEM_CONFIG:-../common/sys_config.yaml}:/openair-upf/etc/config.yaml
        depends_on:
            - oai-smf
        cap_add:
            - NET_ADMIN
            - SYS_ADMIN
            - NET_RAW
        privileged: true
        networks:
            public_net:
                ipv4_address: 192.168.71.134
                interface_name: eth0
            traffic_net:
                ipv4_address: 192.168.72.134
                interface_name: eth1
    oai-ext-dn:
        privileged: true
        container_name: oai-ext-dn
        image: oaisoftwarealliance/trf-gen-cn5g:${TRFGEN_TAG:-latest}
        entrypoint: /bin/bash -c \
              "iptables-legacy -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
              "ip route add 12.1.1.0/24 via 192.168.72.134 dev eth0;"\
              "iperf3 -s &"\
              "sleep infinity"
        depends_on:
            - oai-upf
        networks:
            traffic_net:
                ipv4_address: 192.168.72.135
        healthcheck:
            test: /bin/bash -c "ping -c 2 192.168.72.134"
            interval: 10s
            timeout: 5s
            retries: 5

    # ---- CU: RRC + PDCP. Holds the UE context and triggers F1 handover. No PHY. ----
    oai-cu:
        image: ${GNB_IMAGE:-oai-gnb-cuda}:${GNB_TAG:-latest}
        container_name: oai-cu
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "3"
        user: ${USER_ID:-0}:${GROUP_ID:-0}
        runtime: nvidia
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN
            - SYS_NICE
            - SYS_PTRACE
        environment:
            USE_B2XX: ${USE_B2XX:-no}
            # Telnet 'ci' shared module exposes `trigger_f1_ho`; reachable at 192.168.71.150:9090
            USE_ADDITIONAL_OPTIONS: --log_config.global_log_options level,nocolor,time
                                    --telnetsrv --telnetsrv.listenaddr 192.168.71.150 --telnetsrv.shrmod ci
            ASAN_OPTIONS: detect_leaks=0
        depends_on:
            - oai-ext-dn
        networks:
            public_net:
                ipv4_address: 192.168.71.150
        volumes:
            - ./gnb-cu.conf:/opt/oai-gnb/etc/gnb.conf
            - ./neighbour-config.conf:/opt/oai-gnb/etc/neighbour-config.conf
            # CU-only patched binary: the stock oai-gnb-cuda nr-softmodem crashes
            # as a pure CU because the fork's plugin hook (nr-softmodem.c:648)
            # unconditionally dereferences RC.gNB[0], which is NULL when there is
            # no L1/PHY. This binary guards that deref (passes NULL like the UE).
            # See README.md "CU binary patch". The DUs use the stock image as-is.
            - ./bin/nr-softmodem-cu:/opt/oai-gnb/bin/nr-softmodem:ro
        healthcheck:
            test: /bin/bash -c "pgrep -f softmodem"
            interval: 10s
            timeout: 5s
            retries: 5

    # ---- DU0: RLC+MAC+PHY, cell PCI 0 @ 3619.2 MHz. rfsim client -> UE. ----
    oai-du-pci0:
        image: ${GNB_IMAGE:-oai-gnb-cuda}:${GNB_TAG:-latest}
        container_name: oai-du-pci0
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "3"
        user: ${USER_ID:-0}:${GROUP_ID:-0}
        runtime: nvidia
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN
            - SYS_NICE
            - IPC_LOCK
            - SYS_PTRACE
        environment:
            USE_B2XX: ${USE_B2XX:-no}
            USE_ADDITIONAL_OPTIONS: --rfsim
                                    --log_config.global_log_options level,nocolor,time
                                    --rfsimulator.options chanmod
                                    ${DU0_THREAD_POOL:-}
            ASAN_OPTIONS: detect_leaks=0
        depends_on:
            - oai-cu
        networks:
            public_net:
                ipv4_address: 192.168.71.171
        volumes:
            - /tmp/nvidia-mps:/tmp/nvidia-mps
            - /tmp/nvidia-log:/tmp/nvidia-log
            - ./gnb-du.conf:/opt/oai-gnb/etc/gnb.conf
            - ../../plugins:/opt/oai-gnb/plugins
        ipc: host
        healthcheck:
            test: /bin/bash -c "pgrep -f softmodem"
            interval: 10s
            timeout: 5s
            retries: 5

    # ---- DU1: RLC+MAC+PHY, cell PCI 1 @ 3649.44 MHz. Same conf as DU0 with the
    #      per-instance values overridden on the command line (DU ID, cellid, PCI,
    #      frequency, F1 address). Copy this block to add DU2/DU3. ----
    oai-du-pci1:
        image: ${GNB_IMAGE:-oai-gnb-cuda}:${GNB_TAG:-latest}
        container_name: oai-du-pci1
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "3"
        user: ${USER_ID:-0}:${GROUP_ID:-0}
        runtime: nvidia
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN
            - SYS_NICE
            - IPC_LOCK
            - SYS_PTRACE
        environment:
            USE_B2XX: ${USE_B2XX:-no}
            USE_ADDITIONAL_OPTIONS: --rfsim
                                    --log_config.global_log_options level,nocolor,time
                                    --rfsimulator.options chanmod
                                    --gNBs.[0].gNB_DU_ID 3585
                                    --gNBs.[0].nr_cellid 11111111
                                    --gNBs.[0].servingCellConfigCommon.[0].physCellId 1
                                    --gNBs.[0].servingCellConfigCommon.[0].absoluteFrequencySSB 643296
                                    --gNBs.[0].servingCellConfigCommon.[0].dl_absoluteFrequencyPointA 642024
                                    --gNBs.[0].servingCellConfigCommon.[0].ssb_PositionsInBurst_Bitmap 3
                                    --MACRLCs.[0].local_n_address 192.168.71.172
                                    ${DU1_THREAD_POOL:-}
            ASAN_OPTIONS: detect_leaks=0
        depends_on:
            - oai-cu
        networks:
            public_net:
                ipv4_address: 192.168.71.172
        volumes:
            - /tmp/nvidia-mps:/tmp/nvidia-mps
            - /tmp/nvidia-log:/tmp/nvidia-log
            - ./gnb-du.conf:/opt/oai-gnb/etc/gnb.conf
            - ../../plugins:/opt/oai-gnb/plugins
        ipc: host
        healthcheck:
            test: /bin/bash -c "pgrep -f softmodem"
            interval: 10s
            timeout: 5s
            retries: 5

    # ---- UE: rfsim SERVER (serveraddr=server). Both DUs dial it as clients. ----
    oai-nr-ue:
        image: ${UE_IMAGE:-oai-nr-ue-cuda}:${UE_TAG:-latest}
        container_name: oai-nr-ue
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "3"
        runtime: nvidia
        cap_add:
            - NET_ADMIN
            - NET_RAW
            - SYS_NICE
            - IPC_LOCK
            - SYS_PTRACE
        environment:
            USE_B2XX: ${USE_B2XX:-no}
            USE_ADDITIONAL_OPTIONS: --rfsim
                                    --log_config.global_log_options level,nocolor,time
                                    ${UE_RADIO_OPTIONS:--r 106 --numerology 1 -C 3619200000}
                                    --rfsimulator.options chanmod
                                    --rfsimulator.serveraddr server
                                    --telnetsrv --telnetsrv.shrmod ciUE
                                    --telnetsrv.listenaddr 192.168.71.181 --telnetsrv.listenport 8091
                                    ${UE_THREAD_POOL:-}
            ASAN_OPTIONS: detect_leaks=0
        depends_on:
            - oai-cu
        networks:
            public_net:
                ipv4_address: 192.168.71.181
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - /tmp/nvidia-mps:/tmp/nvidia-mps
            - /tmp/nvidia-log:/tmp/nvidia-log
            - ./nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c 'pgrep nr-uesoftmodem >/dev/null && ip -4 addr show oaitun_ue1 2>/dev/null | grep -q "inet "'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 45s

networks:
    public_net:
        driver: bridge
        name: oai-public-net
        ipam:
            config:
                - subnet: 192.168.71.128/26
        driver_opts:
            com.docker.network.bridge.name: "oai-public"
    traffic_net:
        driver: bridge
        name: oai-traffic-net
        ipam:
            config:
                - subnet: 192.168.72.128/26
        driver_opts:
            com.docker.network.bridge.name: "oai-traffic"
