#
# Neighbour / measurement configuration for UE-triggered (A3-event) handover.
#
# NOT used by the rfsim soft-UE (it cannot send measurement reports; use the
# manual telnet trigger `ci trigger_f1_ho` instead). This file is provided for
# the COTS-UE path: @include it in gnb-cu.conf inside the gNBs block and start a
# real 5G modem UE. The two cells below mirror DU0 (cell 12345678, PCI 0, SSB
# 641280) and DU1 (cell 11111111, PCI 1, SSB 643296).
#
neighbour_list = (
  {
    nr_cellid = 12345678;   # DU0
    neighbour_cell_configuration = (
      {
        gNB_ID = 0xe00;
        nr_cellid = 11111111;   # DU1 is DU0's neighbour
        physical_cellId = 1;
        absoluteFrequencySSB = 643296;
        subcarrierSpacing = 1; #30 KHz
        plmn = { mcc = 262; mnc = 99; mnc_length = 2};
        tracking_area_code = 1;
      }
    )
  },
  {
    nr_cellid = 11111111;   # DU1
    neighbour_cell_configuration = (
      {
        gNB_ID = 0xe00;
        nr_cellid = 12345678;   # DU0 is DU1's neighbour
        physical_cellId = 0;
        absoluteFrequencySSB = 641280;
        subcarrierSpacing = 1; #30 KHz
        plmn = { mcc = 262; mnc = 99; mnc_length = 2};
        tracking_area_code = 1;
      }
    )
  }
);


nr_measurement_configuration = {
  Periodical = {
    enable = 1;
    includeBeamMeasurements = 1;
    maxNrofRS_IndexesToReport = 4;
  };

  A2 = {
    enable = 1;
    threshold = 60;
    timeToTrigger = 1;
  };

  A3 = ({
    cell_id = -1; #Default: applies to any neighbour cell
    offset = 10;
    hysteresis = 0;
    timeToTrigger = 1
  })
};
