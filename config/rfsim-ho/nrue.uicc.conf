#
# F1 handover scenario — UE config.
# IMSI/key match this project's core (config/common/nrue.uicc.conf, PLMN 262/99).
#
# In this scenario the UE is the rfsim SERVER (started with
# --rfsimulator.serveraddr server) and BOTH DUs are rfsim clients that dial it.
# The server applies one channel model per connected client, so there must be
# as many channel models as DUs. Two DUs -> rfsimu_channel_ue0 + rfsimu_channel_ue1.
# Add rfsimu_channel_ue2, ... when you add more DUs.
#
uicc0 = {
  imsi = "262990100000832";
  key = "fec86ba6eb707ed08905757b1bb44b8f";
  opc= "C42449363BBAD02B66D16BC975D77CC1";
  dnn= "oai";
  nssai_sst=1;
}

# channel model used for RF simulator (one entry per connected DU client)
channelmod = {
      max_chan = 10;
      modellist = "modellist_rfsimu_1";
      modellist_rfsimu_1 = (
        { # link to DU0
          model_name     = "rfsimu_channel_ue0";
          type           = "AWGN";
          ploss_dB       = 10;
          noise_power_dB = -6.;
          forgetfact     = 0;
          offset         = 0;
          ds_tdl         = 0;
        },
        { # link to DU1
          model_name     = "rfsimu_channel_ue1";
          type           = "AWGN";
          ploss_dB       = 10;
          noise_power_dB = -6.;
          forgetfact     = 0;
          offset         = 0;
          ds_tdl         = 0;
        }
      );
    };
